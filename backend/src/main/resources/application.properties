
spring.application.name=includi-api

# Conexao com o MySQL do XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/includi_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Definir as credenciais administrativas
spring.security.user.name=${INCLUDI_ADMIN_USER:admin}
spring.security.user.password=${INCLUDI_ADMIN_PASSWORD:*Jrn@081978}
# Porta da API
server.port=8080

